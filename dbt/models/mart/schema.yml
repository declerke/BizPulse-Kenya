version: 2

models:
  - name: mart_economic_pulse
    description: Daily CBK rate and forex aggregates
    columns:
      - name: pulse_date
        tests: [unique, not_null]
      - name: cbr_rate
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is null or cbr_rate > 0"
      - name: usd_kes_mean
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is null or usd_kes_mean > 0"
